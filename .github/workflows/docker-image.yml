name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$(tr -d '[:space:]' < VERSION)"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

  build:
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - meta
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create multi-arch manifest
        shell: bash
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=("-t" "$tag")
            fi
          done <<< "$TAGS"

          digest_args=()
          while IFS= read -r digest_file; do
            digest_args+=("${IMAGE_NAME}@sha256:${digest_file}")
          done < <(find "$RUNNER_TEMP/digests" -type f -printf '%f\n' | sort)

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Verify versioned image on GHCR
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_NAME:$GITHUB_REF_NAME"
          docker buildx imagetools inspect --raw "$image" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | contains(["amd64", "arm64"])'
          docker pull --platform linux/amd64 "$image"
          container="$(docker run --detach --publish 127.0.0.1::3000 "$image")"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          address="$(docker port "$container" 3000/tcp)"
          for ((attempt=1; attempt<=45; attempt++)); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]]; then
              break
            fi
            if curl --fail --silent --max-time 5 "http://$address/api/health" >/dev/null &&
               curl --fail --silent --location --max-time 5 "http://$address/" >/dev/null; then
              docker buildx imagetools inspect "$image" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "The versioned image did not become ready."
          exit 1
